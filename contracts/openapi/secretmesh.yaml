openapi: 3.1.0
info:
  title: SecretMesh API
  version: 0.4.0
  description: |
    SecretMesh control plane API.

    Every endpoint requires authentication: a browser session cookie or an
    organization-scoped API token (`Authorization: Bearer smt_...`).
    Organization endpoints return 404 when the caller is not a member, so
    the existence of other organizations is not revealed.

    Sensitive operations require recent authentication at the identity
    provider ("step-up"). They fail with 401 and error code
    `step_up_required`; the client then sends the browser to
    `/auth/login?step_up=1&return_to=<path>`. Organizations that require MFA
    reject sessions without it with 403 `mfa_required`.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: identity
  - name: organizations
  - name: members
  - name: tokens
  - name: inventory
  - name: access
  - name: changes
  - name: audit
  - name: rotation
  - name: notifications
paths:
  /me:
    get:
      operationId: getMe
      summary: Current user, session and organization memberships
      description: Sessions only; API tokens receive 403.
      tags: [identity]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrganization
      summary: Organization details (org:read)
      tags: [organizations]
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrganization
      summary: Update organization settings (org:write)
      description: Enabling `require_mfa` needs a step-up session that itself used MFA.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganization"
      responses:
        "200":
          description: The updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listMembers
      summary: List members (members:read)
      tags: [members]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMember
      summary: Change a member's role (members:write)
      description: Fails with 409 `last_admin` if the organization would have no admin.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "204":
          description: Updated
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member (members:write)
      description: Fails with 409 `last_admin` if the organization would have no admin.
      tags: [members]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listInvitations
      summary: List open invitations (members:write)
      tags: [members]
      responses:
        "200":
          description: Open invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvitation
      summary: Invite a user by email (members:write)
      description: |
        The invitation is accepted automatically when a user with this
        verified email signs in. Re-inviting an email replaces its open
        invitation. Fails with 409 `already_member`.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitation"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeInvitation
      summary: Revoke an open invitation (members:write)
      tags: [members]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/api-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listApiTokens
      summary: List active API tokens (tokens:manage, sessions only)
      tags: [tokens]
      responses:
        "200":
          description: Active tokens
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      summary: Create an API token (tokens:manage, sessions only, step-up)
      description: The token is returned once and never again.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiToken"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/api-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token (tokens:manage, sessions only)
      tags: [tokens]
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/environments:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listEnvironments
      summary: List environments (org:read)
      tags: [inventory]
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createEnvironment
      summary: Create an environment (org:write)
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironment"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/connections:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listConnections
      summary: List cloud connections (org:read)
      tags: [inventory]
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createConnection
      summary: Create a cloud connection (connection.manage, organization-wide; step-up)
      description: Only providers enabled in this deployment are accepted (`fake` for development and tests; `aws` by default; `azure` and `gcp` when enabled).
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnection"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ConnectionId"
    get:
      operationId: getConnection
      summary: A connection with its provider capabilities (org:read)
      tags: [inventory]
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/connections/{connectionId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ConnectionId"
    post:
      operationId: syncConnection
      summary: Discover secrets now (connection.manage, organization-wide)
      description: |
        Imports metadata only. New secrets are placed by their
        `secretmesh:environment` tag, else the connection's default
        environment; others are reported as unassigned.
      tags: [inventory]
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/role-bindings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listRoleBindings
      summary: List role bindings (members:read)
      tags: [access]
      responses:
        "200":
          description: Role bindings
          content:
            application/json:
              schema:
                type: object
                required: [role_bindings]
                properties:
                  role_bindings:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleBinding"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRoleBinding
      summary: Grant a role to a member (members:write; sessions only; step-up)
      description: Omit `environment_id` for an organization-wide binding.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBinding"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/role-bindings/{bindingId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteRoleBinding
      summary: Remove a role binding (members:write)
      tags: [access]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/approval-policy:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getApprovalPolicy
      summary: Approval policy (org:read)
      tags: [changes]
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalPolicy"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateApprovalPolicy
      summary: Replace the approval policy (policy.manage, organization-wide; step-up)
      tags: [changes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalPolicy"
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalPolicy"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listSecrets
      summary: List secret metadata (secret.read; only environments the caller may read)
      tags: [inventory]
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Secret"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets/{secretId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: secretId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSecret
      summary: Secret metadata (secret.read)
      tags: [inventory]
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSecret
      summary: Set the secret's owner (secret.manage)
      description: The owner receives rotation reminders and escalations first. Send null to clear.
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecret"
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets/{secretId}/versions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: secretId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSecretVersions
      summary: Versions as reported by the provider now (secret.read)
      tags: [inventory]
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecretVersion"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets/{secretId}/reveal:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: secretId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revealSecret
      summary: Read the current value (secret.reveal; sessions only; step-up)
      description: |
        Separately authorized from metadata access. Requires a sign-in
        within 5 minutes, and an MFA session for production or restricted
        secrets. The response is never cached; the reveal is audited without
        the value.
      tags: [inventory]
      responses:
        "200":
          description: The value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedSecret"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets/{secretId}/rotation-policy:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SecretId"
    get:
      operationId: getRotationPolicy
      summary: The secret's rotation policy (secret.read)
      tags: [rotation]
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotationPolicy"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setRotationPolicy
      summary: Create or replace the rotation policy (secret.manage; step-up)
      description: |
        `native` rotates on schedule through the provider's own rotation
        (AWS: the secret's rotation function); the secret must already have
        one. `manual` reminds and escalates until the value changes. The next
        due date counts from the last rotation.
      tags: [rotation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRotationPolicy"
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotationPolicy"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRotationPolicy
      summary: Remove the rotation policy (secret.manage; step-up)
      tags: [rotation]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets/{secretId}/rotate:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: rotateSecret
      summary: Rotate now through the provider (secret.manage; sessions only; step-up)
      description: Production secrets need an MFA session. The rotation runs in the background.
      tags: [rotation]
      responses:
        "202":
          description: Rotation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotationExecution"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/secrets/{secretId}/rotations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SecretId"
    get:
      operationId: listRotations
      summary: Recent rotation attempts (secret.read)
      tags: [rotation]
      responses:
        "200":
          description: Attempts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [rotations]
                properties:
                  rotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RotationExecution"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/change-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listChangeRequests
      summary: List change requests (secret.read; only environments the caller may read)
      tags: [changes]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ChangeRequestStatus"
        - name: break_glass
          in: query
          required: false
          description: Only break-glass changes, for after-the-fact review.
          schema:
            type: boolean
      responses:
        "200":
          description: Change requests, newest first
          content:
            application/json:
              schema:
                type: object
                required: [change_requests]
                properties:
                  change_requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChangeRequest"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChangeRequest
      summary: Request a secret change (secret.create / secret.update / secret.delete)
      description: |
        The value is written straight to the provider's staging area and is
        never stored by SecretMesh. The request is approved immediately if
        the approval policy requires no approvals; it then executes in the
        background after the worker re-checks every gate.
      tags: [changes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/change-requests/{changeRequestId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ChangeRequestId"
    get:
      operationId: getChangeRequest
      summary: A change request with its decisions (secret.read)
      tags: [changes]
      responses:
        "200":
          description: The change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/change-requests/{changeRequestId}/decisions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ChangeRequestId"
    post:
      operationId: decideChangeRequest
      summary: Approve or reject (approval.decide; sessions only; step-up)
      description: |
        `binding_hash` must be the hash shown to the approver; if the request
        changed, the decision fails with 409 `binding_mismatch`. Requesters
        cannot decide their own requests.
      tags: [changes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequest"
      responses:
        "200":
          description: The updated change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/change-requests/{changeRequestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ChangeRequestId"
    post:
      operationId: cancelChangeRequest
      summary: Cancel your own pending or approved request
      tags: [changes]
      responses:
        "204":
          description: Cancelled
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/notification-channels:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listNotificationChannels
      summary: Notification channels (org:read)
      tags: [notifications]
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: object
                required: [channels, email_available]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationChannel"
                  email_available:
                    type: boolean
                    description: Whether this deployment has SMTP configured.
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createNotificationChannel
      summary: Add a channel (notifications.manage; step-up)
      description: |
        Email channels send to the people each notification concerns.
        Slack channels post to an incoming webhook whose URL is stored as a
        secret in your own vault; give its secret ID. The URL is read at
        delivery time and never stored by SecretMesh.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationChannel"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/notification-channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ChannelId"
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a channel (notifications.manage)
      tags: [notifications]
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/notification-channels/{channelId}/test:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: testNotificationChannel
      summary: Send a test notification to you through this channel (notifications.manage)
      tags: [notifications]
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/notifications:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listNotificationDeliveries
      summary: Recent deliveries (notifications.manage)
      tags: [notifications]
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationDelivery"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/audit/events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listAuditEvents
      summary: Audit events, newest first (audit.read, organization-wide)
      tags: [audit]
      parameters:
        - name: before
          in: query
          required: false
          description: Return events with a sequence number below this.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        default:
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/audit/verification:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: verifyAudit
      summary: Recompute the hash chain and verify checkpoint signatures (audit.read, organization-wide)
      tags: [audit]
      responses:
        "200":
          description: Verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sm_session
    bearerToken:
      type: http
      scheme: bearer
      description: Organization-scoped API token (`smt_...`).
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SecretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [org_admin, member]
    Scope:
      type: string
      enum: ["org:read", "org:write", "members:read", "members:write", "secrets:read", "secrets:write", "audit:read"]
    EnvironmentKind:
      type: string
      enum: [development, staging, production]
    Classification:
      type: string
      enum: [internal, confidential, restricted]
    BindingRole:
      type: string
      enum: [cloud_admin, security_admin, secret_admin, developer, approver, auditor, break_glass]
    ChangeRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled, expired, executing, succeeded, failed]
    Environment:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EnvironmentKind"
        created_at:
          type: string
          format: date-time
    CreateEnvironment:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        kind:
          $ref: "#/components/schemas/EnvironmentKind"
    Capabilities:
      type: object
      description: What the provider supports natively.
      required: [secret_create, secret_update, secret_delete, secret_reveal, discovery, versioning, version_labels,
        soft_delete, native_rotation, tags, update_staging, create_staging]
      properties:
        secret_create: {type: boolean}
        secret_update: {type: boolean}
        secret_delete: {type: boolean}
        secret_reveal: {type: boolean}
        discovery: {type: boolean}
        versioning: {type: boolean}
        version_labels: {type: boolean}
        soft_delete: {type: boolean}
        native_rotation: {type: boolean}
        tags: {type: boolean}
        update_staging: {type: string}
        create_staging: {type: string}
    SyncResult:
      type: object
      required: [imported, updated, removed, unassigned, rotated]
      properties:
        rotated:
          type: integer
          description: Known secrets whose current version changed in the provider (counted as rotated).
        imported: {type: integer}
        updated: {type: integer}
        removed: {type: integer}
        unassigned: {type: integer}
    SecretVersion:
      type: object
      required: [id, stages]
      properties:
        id: {type: string}
        stages:
          type: array
          items: {type: string}
        created_at:
          type: string
          format: date-time
    RevealedSecret:
      type: object
      required: [value, version_id]
      properties:
        value:
          type: string
          format: password
        version_id:
          type: string
    Connection:
      type: object
      required: [id, name, provider, config, status, created_at]
      properties:
        default_environment_id:
          type: string
          format: uuid
        last_synced_at:
          type: string
          format: date-time
        last_sync_error:
          type: string
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    CreateConnection:
      type: object
      required: [name, provider]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        provider:
          type: string
          enum: [fake, aws, azure, gcp]
        config:
          type: object
          description: |
            Non-secret settings only; SecretMesh never stores cloud credentials.
            AWS: `role_arn` and `region`.
            Azure: `vault_url` (https://NAME.vault.azure.net) and `tenant_id`.
            GCP: `project_id` and `service_account` (the customer service
            account SecretMesh impersonates).
            SecretMesh generates `external_id` for each cloud connection and
            returns it in the response; the customer proves ownership by
            trusting it (AWS role trust policy) or storing it in a
            `secretmesh-external-id` secret (Azure, GCP).
          additionalProperties:
            type: string
        default_environment_id:
          type: string
          format: uuid
          description: Environment for discovered secrets without a secretmesh:environment tag.
    RoleBinding:
      type: object
      required: [id, user_id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/BindingRole"
        environment_id:
          type: string
          format: uuid
          description: Absent for organization-wide bindings.
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    CreateRoleBinding:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/BindingRole"
        environment_id:
          type: string
          format: uuid
    ApprovalRule:
      type: object
      required: [environment, operation, classification, required_approvals]
      additionalProperties: false
      properties:
        environment:
          type: string
          enum: ["*", development, staging, production]
        operation:
          type: string
          enum: ["*", create, update, delete]
        classification:
          type: string
          enum: ["*", internal, confidential, restricted]
        required_approvals:
          type: integer
          minimum: 0
          maximum: 5
    ApprovalPolicy:
      type: object
      required: [rules]
      additionalProperties: false
      description: The requirement for a change is the maximum over all matching rules.
      properties:
        rules:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ApprovalRule"
    Secret:
      type: object
      required: [id, connection_id, environment_id, environment_kind, name, provider_ref, classification, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_kind:
          $ref: "#/components/schemas/EnvironmentKind"
        name:
          type: string
        provider_ref:
          type: string
        classification:
          $ref: "#/components/schemas/Classification"
        current_version:
          type: string
        status:
          type: string
        origin:
          type: string
          enum: [created, discovered]
        description:
          type: string
        tags:
          type: object
          additionalProperties: {type: string}
        provider_metadata:
          type: object
          additionalProperties: {type: string}
        last_seen_at:
          type: string
          format: date-time
        owner_user_id:
          type: string
          format: uuid
        last_rotated_at:
          type: string
          format: date-time
        rotation_strategy:
          $ref: "#/components/schemas/RotationStrategy"
        rotation_enabled:
          type: boolean
        next_rotation_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateSecret:
      type: object
      required: [owner_user_id]
      properties:
        owner_user_id:
          type: [string, "null"]
          format: uuid
    CreateChangeRequest:
      type: object
      required: [operation]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [create, update, delete]
        secret_id:
          type: string
          format: uuid
          description: Required for update and delete.
        connection_id:
          type: string
          format: uuid
          description: Required for create.
        environment_id:
          type: string
          format: uuid
          description: Required for create.
        name:
          type: string
          description: Required for create.
        classification:
          $ref: "#/components/schemas/Classification"
        value:
          type: string
          format: password
          writeOnly: true
          maxLength: 65536
          description: Required for create and update. Staged in the provider, never stored by SecretMesh.
        reason:
          type: string
          maxLength: 1000
        break_glass:
          type: boolean
          description: |
            Emergency change without prior approval. Needs the break_glass
            role, an MFA session, a sign-in within 5 minutes and a reason of
            at least 20 characters. Flagged and audited for review.
    Decision:
      type: object
      required: [approver_id, decision, mfa, created_at]
      properties:
        approver_id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approve, reject]
        mfa:
          type: boolean
        comment:
          type: string
        created_at:
          type: string
          format: date-time
    ChangeRequest:
      type: object
      required: [id, operation, status, connection_id, environment_id, environment_kind, secret_name, classification,
        binding_hash, required_approvals, requested_by, created_at, updated_at, expires_at, decisions]
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [create, update, delete]
        status:
          $ref: "#/components/schemas/ChangeRequestStatus"
        secret_id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_kind:
          $ref: "#/components/schemas/EnvironmentKind"
        secret_name:
          type: string
        classification:
          $ref: "#/components/schemas/Classification"
        binding_hash:
          type: string
          description: Hex SHA-256 of everything this request would do, including a keyed MAC of the value. Approvers submit it back.
        required_approvals:
          type: integer
        break_glass:
          type: boolean
        reason:
          type: string
        requested_by:
          type: string
          format: uuid
        requester_token_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failure_code:
          type: string
        provider_version_id:
          type: string
        cloud_request_id:
          type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
    DecideChangeRequest:
      type: object
      required: [decision, binding_hash]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        binding_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        comment:
          type: string
          maxLength: 1000
    AuditEvent:
      type: object
      required: [seq, id, occurred_at, actor_type, action, resource_type, resource_id, decision, details, prev_hash, hash]
      properties:
        seq:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, api_token, system]
        actor_id:
          type: string
          format: uuid
        actor_token_id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        decision:
          type: string
          enum: [allow, deny, none]
        change_request_id:
          type: string
          format: uuid
        cloud_request_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        prev_hash:
          type: string
        hash:
          type: string
    AuditVerification:
      type: object
      required: [valid, events_checked, head_seq, checkpoints_verified]
      properties:
        valid:
          type: boolean
        events_checked:
          type: integer
          format: int64
        head_seq:
          type: integer
          format: int64
        head_hash:
          type: string
        checkpoints_verified:
          type: integer
        last_checkpoint_seq:
          type: integer
          format: int64
        last_exported_seq:
          type: integer
          format: int64
          description: Last event copied to write-once storage, if export is configured.
        first_invalid_seq:
          type: integer
          format: int64
        problem:
          type: string
    Me:
      type: object
      required: [user, session, organizations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
    Session:
      type: object
      required: [mfa]
      properties:
        mfa:
          type: boolean
          description: Whether the login satisfied multi-factor authentication.
        authenticated_at:
          type: string
          format: date-time
          description: When the user last authenticated at the identity provider, if known.
    OrganizationMembership:
      type: object
      required: [id, name, slug, role, require_mfa]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        require_mfa:
          type: boolean
    Organization:
      type: object
      required: [id, name, slug, require_mfa, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        require_mfa:
          type: boolean
        role:
          $ref: "#/components/schemas/Role"
          description: The caller's role (for API tokens, the creator's role).
    UpdateOrganization:
      type: object
      required: [require_mfa]
      additionalProperties: false
      properties:
        require_mfa:
          type: boolean
    Member:
      type: object
      required: [user_id, email, display_name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joined_at:
          type: string
          format: date-time
    Invitation:
      type: object
      required: [id, email, role, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        invited_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CreateInvitation:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: "#/components/schemas/Role"
    ApiToken:
      type: object
      required: [id, name, display_prefix, scopes, created_by, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_prefix:
          type: string
          description: Leading characters of the token, for recognition.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    CreateApiToken:
      type: object
      required: [name, scopes, expires_in_days]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
    CreatedApiToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        secret:
          type: string
          description: The API token. Shown only in this response.
    RotationStrategy:
      type: string
      enum: [native, manual]
    RotationPolicy:
      type: object
      required: [secret_id, strategy, interval_days, reminder_days, escalation_days, enabled, next_rotation_at, updated_at]
      properties:
        secret_id:
          type: string
          format: uuid
        strategy:
          $ref: "#/components/schemas/RotationStrategy"
        interval_days:
          type: integer
        reminder_days:
          type: array
          items: {type: integer}
        escalation_days:
          type: array
          items: {type: integer}
        enabled:
          type: boolean
        next_rotation_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
    SetRotationPolicy:
      type: object
      required: [strategy, interval_days]
      properties:
        strategy:
          $ref: "#/components/schemas/RotationStrategy"
        interval_days:
          type: integer
          minimum: 1
          maximum: 3650
        reminder_days:
          type: array
          description: Days before the due date to remind (manual strategy). Default 7, 3, 1.
          maxItems: 10
          items: {type: integer, minimum: 0, maximum: 365}
        escalation_days:
          type: array
          description: |
            Days after the due date to escalate: first to the owner, then
            also the security team, then also organization admins. Default 1, 3, 7.
          maxItems: 3
          items: {type: integer, minimum: 0, maximum: 365}
        enabled:
          type: boolean
          default: true
    RotationExecution:
      type: object
      required: [id, secret_id, trigger, status, due_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [schedule, manual]
        requested_by:
          type: string
          format: uuid
        status:
          type: string
          enum: [scheduled, rotating, verifying, succeeded, failed]
        due_at:
          type: string
          format: date-time
        provider_version_id:
          type: string
        cloud_request_id:
          type: string
        error_code:
          type: string
        rotate_started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationChannel:
      type: object
      required: [id, kind, name, enabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [email, slack]
        name:
          type: string
        webhook_secret_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateNotificationChannel:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [email, slack]
        name:
          type: string
          minLength: 1
          maxLength: 100
        webhook_secret_id:
          type: string
          format: uuid
          description: Slack only. A secret whose value is the incoming webhook URL.
    NotificationDelivery:
      type: object
      required: [notification_id, event, subject, channel, status, attempts, created_at]
      properties:
        notification_id:
          type: string
          format: uuid
        event:
          type: string
        subject:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [pending, sent, failed]
        attempts:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
