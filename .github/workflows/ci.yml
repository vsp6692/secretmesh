name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-static:
    name: Go static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
      - name: Formatting
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l > /tmp/unformatted
          if [ -s /tmp/unformatted ]; then echo "Run gofmt on:"; cat /tmp/unformatted; exit 1; fi
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Licensing: the legal documents are complete, every source file carries its
  # SPDX header, every dependency licence follows docs/legal/license-policy.json,
  # the third-party notice file matches the dependency tree, and SBOMs are built.
  # Nothing here limits how permitted (internal) deployments run.
  licenses:
    name: Licences and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies (needed to read their licences)
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Licensing documents are complete and consistent
        run: scripts/check-legal-files.sh
      - name: Source files carry the licence header
        run: go run ./scripts/licenses headers-check
      - name: Dependency licences follow the policy
        run: go run ./scripts/licenses check
      - name: Third-party notice file is up to date
        run: go run ./scripts/licenses verify
      - name: Software bills of materials
        run: scripts/sbom.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/sbom/
          if-no-files-found: error
          retention-days: 90

  # The whole suite, including every AWS integration test, runs once per
  # emulator. The same code must behave the same on both. Tests may not skip:
  # a skipped integration test means the environment is not wired up.
  go:
    name: Go tests (${{ matrix.emulator }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { emulator: localstack, endpoint: "http://127.0.0.1:4566" }
          - { emulator: moto, endpoint: "http://127.0.0.1:5050" }
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Pinned to 4.14.0, the newest release that runs without an auth token
      # (fork pull requests have no secrets). Keep in sync with
      # deployments/docker/compose.test.yaml.
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: secretsmanager,sts,kms,s3
          DISABLE_EVENTS: "1"
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 3s --health-timeout 5s --health-retries 40
      moto:
        image: motoserver/moto:5.2.5
        ports: ["5050:5000"]
    env:
      SECRETMESH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SECRETMESH_TEST_AWS_ENDPOINT: ${{ matrix.endpoint }}
      COVER_MIN: "74" # keep in sync with COVER_MIN in the Makefile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for the emulator
        run: |
          curl -s -o /dev/null --retry 60 --retry-delay 2 --retry-connrefused "$SECRETMESH_TEST_AWS_ENDPOINT/" \
            || { echo "emulator did not become reachable"; exit 1; }
      - name: Tests (race detector, no skips, coverage floor)
        run: scripts/go-test-strict.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --omit=dev --audit-level=high

  security:
    name: Secret scan & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --no-banner --redact --config .gitleaks.toml
      - name: semgrep
        run: |
          python3 -m pip install --quiet semgrep==1.185.0
          semgrep scan --config p/default --config p/golang --config p/typescript --metrics=off --error

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor (GitHub Actions security)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: regular

  docker:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build -f deployments/docker/api.Dockerfile -t secretmesh/api:ci .
      - name: Build web image
        run: docker build -f deployments/docker/web.Dockerfile -t secretmesh/web:ci .

  # Single required status check for branch protection: passes only when
  # every job above passed (skipped or cancelled jobs count as failures).
  ci-ok:
    name: CI passed
    if: always()
    needs: [go-static, licenses, go, web, security, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
