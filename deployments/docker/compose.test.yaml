# Throwaway stack for the integration tests (`make test-integration`).
# Everything lives in memory and uses its own ports, so it never touches the
# development stack in compose.yaml.
#
#   docker compose -f deployments/docker/compose.test.yaml up -d --wait
name: secretmesh-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secretmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  # LocalStack is pinned to 4.14.0: it is the newest release that runs without
  # an account or auth token, which contributors and fork pull requests do not
  # have. Later releases refuse to start without LOCALSTACK_AUTH_TOKEN.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: secretsmanager,sts,kms,s3
      DISABLE_EVENTS: "1"
      DEBUG: "0"
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 60

  # The second emulator. The AWS code must behave the same on both.
  moto:
    image: motoserver/moto:5.2.5
    ports:
      - "127.0.0.1:5051:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 5s
      retries: 30
